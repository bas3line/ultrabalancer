[package]
name = "ultrabalancer"
version = "3.0.0"
edition = "2021"
rust-version = "1.75"
authors = ["Kira <hi@ykira.com>"]
description = "High-performance load balancer - 500k+ RPS"
license = "MIT"
repository = "https://github.com/bas3line/ultrabalancer-rs"

[[bin]]
name = "ultrabalancer"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full", "parking_lot"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full", "tokio", "client", "server", "http2"] }
http-body-util = "0.1"
http = "1"
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
async-compression = { version = "0.4", features = ["tokio", "gzip", "brotli", "zstd"] }
clap = { version = "4", features = ["derive", "env"] }
anstyle = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
anyhow = "1"
thiserror = "2"
tower = { version = "0.5", features = ["full"] }
parking_lot = "0.12"
dashmap = "6"
crossbeam = "0.8"
arc-swap = "1"
bytes = "1"
futures = "0.3"
async-trait = "0.1"
once_cell = "1"
num_cpus = "1"
governor = "0.8"
moka = { version = "0.12", features = ["future"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "fast-rng"] }
ipnet = "2"
socket2 = { version = "0.5", features = ["all"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
ahash = "0.8"
mimalloc = { version = "0.1", default-features = false }
pin-project-lite = "0.2"
tokio-tungstenite = "0.24"
fastrand = "2"
smallvec = "1"
memchr = "2"

[[example]]
name = "mock_backend"
path = "examples/mock_backend.rs"

[[example]]
name = "stress_test"
path = "examples/stress_test.rs"

[[example]]
name = "multi_stress"
path = "examples/multi_stress.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
