[package]
name = "ultrabalancer"
version = "2.0.0"
edition = "2021"
rust-version = "1.75"
authors = ["Kira <hi@ykira.com>"]
description = "Production-ready, high-performance load balancer"
license = "MIT"
repository = "https://github.com/bas3line/ultrabalancer-rs"
keywords = ["load-balancer", "proxy", "http", "networking", "async"]
categories = ["network-programming", "web-programming::http-server"]

[[bin]]
name = "ultrabalancer"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.40", features = ["full", "tracing"] }
hyper = { version = "1.5", features = ["full"] }
hyper-util = { version = "0.1", features = ["full", "tokio", "client", "server"] }
http-body-util = "0.1"
clap = { version = "4.5", features = ["derive", "color", "suggestions", "env", "wrap_help"] }
anstyle = "1.0"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "ansi"] }
anyhow = "1.0"
thiserror = "1.0"
tower = { version = "0.5", features = ["util", "timeout", "load-shed", "limit", "buffer"] }
parking_lot = "0.12"
dashmap = "6.1"
reqwest = { version = "0.12", features = ["json", "stream"] }
bytes = "1.8"
futures = "0.3"
async-trait = "0.1"
once_cell = "1.20"
arc-swap = "1.7"
crossbeam = "0.8"
num_cpus = "1.16"
governor = "0.6"
nonzero_ext = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
